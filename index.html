<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sister Birthday Reel Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">✨</div>
        <h1>Birthday Reel</h1>
        <p>Enter your name and unlock the tribute.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="username">Your Name</label>
        <input id="username" name="username" type="text" placeholder="Sister's name" required />

        <label for="password">Passcode</label>
        <input id="password" name="password" type="password" placeholder="Enter passcode" required />

        <button type="submit">Join the celebration</button>
      </form>

      <div class="message" id="message"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
